<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LocalBoost AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }

    header {
      background: #111827;
      color: white;
      padding: 35px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 36px;
    }

    header p {
      color: #d1d5db;
    }

    .container {
      width: 92%;
      max-width: 900px;
      margin: 30px auto;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      margin-bottom: 30px;
    }

    h2 {
      margin-top: 0;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 16px;
      margin-bottom: 6px;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 16px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      width: 100%;
      border: none;
      padding: 14px;
      margin-top: 18px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: #2563eb;
      color: white;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .secondaryButton {
      background: #374151;
    }

    .logoutButton {
      background: #dc2626;
    }

    #signupStatus,
    #loginStatus,
    #aiStatus,
    #actionMessage,
    #sessionStatus,
    #pricingStatus {
      margin-top: 15px;
      font-weight: bold;
      text-align: center;
    }

    #accountCard {
      display: none;
    }

    #accountInfo {
      margin-top: 15px;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      padding: 15px;
      border-radius: 10px;
      line-height: 1.7;
    }

    #aiResult {
      display: none;
      white-space: pre-wrap;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 18px;
      margin-top: 20px;
      line-height: 1.6;
    }

    #aiImage {
      display: none;
      width: 100%;
      max-width: 600px;
      margin: 20px auto 0;
      border-radius: 12px;
    }

    #resultActions {
      display: none;
      gap: 10px;
      margin-top: 15px;
    }

    .pricing {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    .priceCard {
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 22px;
      text-align: center;
    }

    .price {
      font-size: 30px;
      font-weight: bold;
      margin: 15px 0;
    }

    .priceMonthly {
      color: #6b7280;
      margin-top: -8px;
    }

    .planButton {
      margin-top: 15px;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #6b7280;
    }

    @media (max-width: 700px) {
      .pricing {
        grid-template-columns: 1fr;
      }

      header h1 {
        font-size: 30px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>LocalBoost AI</h1>
  <p>Create professional social media content in seconds.</p>
</header>

<main class="container">

  <section id="accountCard" class="card">
    <h2>👤 Your Account</h2>

    <div id="accountInfo"></div>

    <button
      id="logoutButton"
      class="logoutButton"
      type="button"
    >
      Logout
    </button>

    <div id="sessionStatus"></div>
  </section>


  <section id="signupCard" class="card">
    <h2>👤 Create Your Account</h2>

    <label for="signupBusinessName">
      Business name
    </label>

    <input
      id="signupBusinessName"
      type="text"
      placeholder="Example: Gloucester Shine"
    >

    <label for="signupEmail">
      Email address
    </label>

    <input
      id="signupEmail"
      type="email"
      placeholder="you@example.com"
      autocomplete="email"
    >

    <label for="signupPassword">
      Password
    </label>

    <input
      id="signupPassword"
      type="password"
      placeholder="Minimum 8 characters"
      autocomplete="new-password"
    >

    <button
      id="signupButton"
      type="button"
    >
      Create Account
    </button>

    <div id="signupStatus"></div>
  </section>


  <section id="loginCard" class="card">
    <h2>🔐 Customer Login</h2>

    <label for="loginEmail">
      Email address
    </label>

    <input
      id="loginEmail"
      type="email"
      placeholder="you@example.com"
      autocomplete="email"
    >

    <label for="loginPassword">
      Password
    </label>

    <input
      id="loginPassword"
      type="password"
      placeholder="Enter your password"
      autocomplete="current-password"
    >

    <button
      id="loginButton"
      type="button"
    >
      Login
    </button>

    <div id="loginStatus"></div>
  </section>


  <section id="generatorCard" class="card">
    <h2>✨ Create Your Social Media Post</h2>

    <label for="businessName">
      Business name
    </label>

    <input
      id="businessName"
      type="text"
      placeholder="Example: Gloucester Shine"
    >

    <label for="businessType">
      Business type
    </label>

    <input
      id="businessType"
      type="text"
      placeholder="Example: Mobile car valeting"
    >

    <label for="location">
      Location
    </label>

    <input
      id="location"
      type="text"
      placeholder="Example: Gloucester"
    >

    <label for="service">
      Service or offer
    </label>

    <input
      id="service"
      type="text"
      placeholder="Example: Full interior and exterior car valet"
    >

    <label for="extraDetails">
      Extra details
    </label>

    <textarea
      id="extraDetails"
      placeholder="Tell the AI anything else it should know."
    ></textarea>

    <button
      id="generateButton"
      type="button"
    >
      ✨ Generate Post & Picture
    </button>

    <div id="aiStatus"></div>

    <div id="aiResult"></div>

      alt="
