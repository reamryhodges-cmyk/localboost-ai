<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LocalBoost AI</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  color: #1f2937;
}

header {
  background: #111827;
  color: white;
  padding: 30px 20px;
  text-align: center;
}

.container {
  width: 92%;
  max-width: 850px;
  margin: 25px auto;
}

.card {
  background: white;
  padding: 22px;
  border-radius: 14px;
  margin-bottom: 24px;
  box-shadow: 0 4px 18px rgba(0,0,0,.08);
}

input,
textarea,
button {
  width: 100%;
  box-sizing: border-box;
  font-size: 16px;
}

input,
textarea {
  padding: 12px;
  margin: 6px 0 12px;
  border: 1px solid #d1d5db;
  border-radius: 8px;
}

textarea {
  min-height: 90px;
}

button {
  padding: 13px;
  border: 0;
  border-radius: 8px;
  background: #2563eb;
  color: white;
  font-weight: bold;
  margin-top: 8px;
  cursor: pointer;
}

button:disabled {
  opacity: .6;
  cursor: not-allowed;
}

#accountCard {
  display: none;
}

#aiResult,
#aiImage,
#resultActions {
  display: none;
}

#aiResult {
  white-space: pre-wrap;
  background: #f9fafb;
  padding: 15px;
  border-radius: 10px;
  margin-top: 15px;
}

#aiImage {
  width: 100%;
  margin-top: 15px;
  border-radius: 10px;
}

.pricing {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

.priceCard {
  border: 1px solid #ddd;
  border-radius: 10px;
  padding: 16px;
  text-align: center;
}

.price {
  font-size: 28px;
  font-weight: bold;
}

.status {
  margin-top: 12px;
  text-align: center;
  font-weight: bold;
}

@media (max-width: 700px) {
  .pricing {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<header>
  <h1>LocalBoost AI</h1>
  <p>Create professional social media content in seconds.</p>
</header>

<main class="container">

<section id="accountCard" class="card">
  <h2>Your Account</h2>

  <div id="accountInfo"></div>

  <button id="logoutButton" type="button">
    Logout
  </button>

  <div id="sessionStatus" class="status"></div>
</section>


<section id="signupCard" class="card">
  <h2>Create Account</h2>

  <label for="signupBusinessName">Business name</label>
  <input id="signupBusinessName" type="text">

  <label for="signupEmail">Email</label>
  <input id="signupEmail" type="email">

  <label for="signupPassword">Password</label>
  <input id="signupPassword" type="password">

  <button id="signupButton" type="button">
    Create Account
  </button>

  <div id="signupStatus" class="status"></div>
</section>


<section id="loginCard" class="card">
  <h2>Customer Login</h2>

  <label for="loginEmail">Email</label>
  <input id="loginEmail" type="email">

  <label for="loginPassword">Password</label>
  <input id="loginPassword" type="password">

  <button id="loginButton" type="button">
    Login
  </button>

  <div id="loginStatus" class="status"></div>
</section>


<section class="card">
  <h2>Create Your Social Media Post</h2>

  <label for="businessName">Business name</label>
  <input id="businessName" type="text">

  <label for="businessType">Business type</label>
  <input id="businessType" type="text">

  <label for="location">Location</label>
  <input id="location" type="text">

  <label for="service">Service or offer</label>
  <input id="service" type="text">

  <label for="extraDetails">Extra details</label>
  <textarea id="extraDetails"></textarea>

  <button id="generateButton" type="button">
    Generate Post & Picture
  </button>

  <div id="aiStatus" class="status"></div>

  <div id="aiResult"></div>

  <img id="aiImage" alt="AI generated image">

  <div id="resultActions">
    <button id="copyButton" type="button">
      Copy Post
    </button>

    <button id="downloadButton" type="button">
      Download Picture
    </button>
  </div>

  <div id="actionMessage" class="status"></div>
</section>


<section class="card">
  <h2>Choose Your Plan</h2>

  <div class="pricing">

    <div class="priceCard">
      <h3>Starter</h3>

      <div class="price">£9.99</div>

      <p>per month</p>

      <button
        class="planButton"
        data-plan="starter"
        type="button"
      >
        Choose Starter
      </button>
    </div>


    <div class="priceCard">
      <h3>Business</h3>

      <div class="price">£24.99</div>

      <p>per month</p>

      <button
        class="planButton"
        data-plan="business"
        type="button"
      >
        Choose Business
      </button>
    </div>


    <div class="priceCard">
      <h3>Pro</h3>

      <div class="price">£49.99</div>

      <p>per month</p>

      <button
        class="planButton"
        data-plan="pro"
        type="button"
      >
        Choose Pro
      </button>
    </div>

  </div>

  <div id="pricingStatus" class="status"></div>
</section>

</main>


<script>
"use strict";

const $ = (id) => document.getElementById(id);

let currentUser = null;


function normaliseUser(data) {
  if (!data) {
    return null;
  }

  if (data.user) {
    return data.user;
  }

  if (data.email) {
    return data;
  }

  return null;
}


function getBusinessName(user) {
  return (
    user.businessName ||
    user.business_name ||
    user.email ||
    "Customer"
  );
}


function getGenerationsUsed(user) {
  if (user.generationsUsed !== undefined) {
    return user.generationsUsed;
  }

  if (user.generations_used !== undefined) {
    return user.generations_used;
  }

  return 0;
}


function showUser(user) {
  currentUser = user;

  $("signupCard").style.display = "none";
  $("loginCard").style.display = "none";
  $("accountCard").style.display = "block";

  $("accountInfo").innerHTML =
    "<b>Welcome, " +
    escapeHtml(getBusinessName(user)) +
    "</b><br>" +
    "Email: " +
    escapeHtml(user.email || "") +
    "<br>" +
    "Plan: " +
    escapeHtml(user.plan || "free") +
    "<br>" +
    "Generations used: " +
    escapeHtml(String(getGenerationsUsed(user)));

  const businessName =
    user.businessName ||
    user.business_name;

  if (businessName) {
    $("businessName").value = businessName;
  }
}


function showLoggedOut() {
  currentUser = null;

  $("signupCard").style.display = "block";
  $("loginCard").style.display = "block";
  $("accountCard").style.display = "none";
}


function escapeHtml(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


async function checkSession() {
  try {
    const response = await fetch(
      "/me",
      {
        method: "GET",
        credentials: "same-origin",
        cache: "no-store"
      }
    );

    const data = await response.json();

    const user = normaliseUser(data);

    if (
      response.ok &&
      (
        data.loggedIn === true ||
        user
      ) &&
      user
    ) {
      showUser(user);
      return;
    }

    showLoggedOut();

  } catch (error) {
    console.error("Session check failed:", error);
    showLoggedOut();
  }
}


$("signupButton").addEventListener(
  "click",
  async function () {

    const status = $("signupStatus");

    status.textContent =
      "Creating account...";

    try {
      const response = await fetch(
        "/signup",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            businessName:
              $("signupBusinessName")
                .value
                .trim(),

            email:
              $("signupEmail")
                .value
                .trim(),

            password:
              $("signupPassword")
                .value
          })
        }
      );

      const data = await response.json();

      if (!response.ok) {
        throw new Error(
          data.error ||
          data.message ||
          "Signup failed."
        );
      }

      status.textContent =
        "✅ Account created. You can now log in.";

      $("loginEmail").value =
        $("signupEmail")
          .value
          .trim();

    } catch (error) {
      status.textContent =
        "❌ " + error.message;
    }
  }
);


$("loginButton").addEventListener(
  "click",
  async function () {

    const status = $("loginStatus");
    const button = $("loginButton");

    status.textContent =
      "Logging in...";

    button.disabled = true;

    try {
      const response = await fetch(
        "/login",
        {
          method: "POST",

          credentials: "same-origin",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            email:
              $("loginEmail")
                .value
                .trim(),

            password:
              $("loginPassword")
                .value
          })
        }
      );

      let data = {};

      try {
        data = await response.json();
      } catch {
        throw new Error(
          "The server returned an invalid login response."
        );
      }

      if (!response.ok) {
        throw new Error(
          data.error ||
          data.message ||
          "Login failed."
        );
      }

      let user = normaliseUser(data);

      /*
        Some login versions may return only
        success. If so, read the account from /me.
      */
      if (!user) {
        const meResponse = await fetch(
          "/me",
          {
            credentials: "same-origin",
            cache: "no-store"
          }
        );

        const meData =
          await meResponse.json();

        user =
          normaliseUser(meData);
      }

      if (!user) {
        throw new Error(
          "Login succeeded but account information could not be loaded."
        );
      }

      status.textContent =
        "✅ Login successful";

      showUser(user);

    } catch (error) {
      console.error("Login error:", error);

      status.textContent =
        "❌ " + error.message;

    } finally {
      button.disabled = false;
    }
  }
);


$("logoutButton").addEventListener(
  "click",
  async function () {

    const status =
      $("sessionStatus");

    status.textContent =
      "Logging out...";

    try {
      await fetch(
        "/logout",
        {
          method: "POST",
          credentials: "same-origin"
        }
      );

      showLoggedOut();

      $("loginStatus").textContent =
        "✅ Logged out";

      status.textContent = "";

    } catch (error) {
      status.textContent =
        "❌ Logout failed";
    }
  }
);


$("generateButton").addEventListener(
  "click",
  async function () {

    const status =
      $("aiStatus");

    const button =
      $("generateButton");

    status.textContent =
      "Creating...";

    button.disabled = true;

    $("aiResult").style.display =
      "none";

    $("aiImage").style.display =
      "none";

    $("resultActions").style.display =
      "none";

    $("actionMessage").textContent =
      "";

    try {
      const response = await fetch(
        "/generate",
        {
          method: "POST",

          credentials:
            "same-origin",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            businessName:
              $("businessName")
                .value
                .trim(),

            businessType:
              $("businessType")
                .value
                .trim(),

            location:
              $("location")
                .value
                .trim(),

            service:
              $("service")
                .value
                .trim(),

            extraDetails:
              $("extraDetails")
                .value
                .trim()
          })
        }
      );

      const data =
        await response.json();

      if (!response.ok) {
        throw new Error(
          data.error ||
          data.message ||
          "Generation failed."
        );
      }

      const postText =
        data.result ||
        data.post ||
        data.text ||
        "";

      const image =
        data.image ||
        data.imageUrl ||
        data.image_url ||
        "";

      if (postText) {
        $("aiResult").textContent =
          postText;

        $("aiResult").style.display =
          "block";
      }

      if (image) {
        $("aiImage").src =
          image;

        $("aiImage").style.display =
          "block";
      }

      if (postText || image) {
        $("resultActions").style.display =
          "block";
      }

      status.textContent =
        "✅ Ready";

    } catch (error) {
      console.error(
        "Generation error:",
        error
      );

      status.textContent =
        "❌ " + error.message;

    } finally {
      button.disabled = false;
    }
  }
);


$("copyButton").addEventListener(
  "click",
  async function () {

    const text =
      $("aiResult").textContent;

    if (!text) {
      $("actionMessage").textContent =
        "❌ There is no post to copy.";
      return;
    }

    try {
      await navigator.clipboard.writeText(
        text
      );

      $("actionMessage").textContent =
        "✅ Post copied";

    } catch {
      $("actionMessage").textContent =
        "❌ Could not copy the post.";
    }
  }
);


$("downloadButton").addEventListener(
  "click",
  function () {

    const image =
      $("aiImage").src;

    if (!image) {
      $("actionMessage").textContent =
        "❌ There is no picture to download.";
      return;
    }

    const link =
      document.createElement("a");

    link.href = image;

    link.download =
      "localboost-ai-picture.jpg";

    document.body.appendChild(link);

    link.click();

    link.remove();
  }
);


document
  .querySelectorAll(".planButton")
  .forEach(function (button) {

    button.addEventListener(
      "click",
      async function () {

        const status =
          $("pricingStatus");

        status.textContent =
          "Opening secure checkout...";

        button.disabled = true;

        try {
          /*
            Always check /me immediately
            before creating checkout.
          */
          const meResponse =
            await fetch(
              "/me",
              {
                method: "GET",
                credentials:
                  "same-origin",
                cache: "no-store"
              }
            );

          const meData =
            await meResponse.json();

          const user =
            normaliseUser(meData);

          if (
            !meResponse.ok ||
            !user
          ) {
            throw new Error(
              "Please log in before choosing a plan."
            );
          }

          currentUser = user;

          /*
            ONLY this dedicated LocalBoost
            test account is allowed to use
            Stripe Sandbox.

            All other customers use live
            Stripe checkout.
          */
          const isSandboxTestAccount =
            String(
              currentUser.email || ""
            )
              .trim()
              .toLowerCase() ===
            "samtest1109@example.com";

          const response =
            await fetch(
              "/create-checkout-session",
              {
                method: "POST",

                credentials:
                  "same-origin",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body: JSON.stringify({
                  plan:
                    button.dataset.plan,

                  mode:
                    isSandboxTestAccount
                      ? "sandbox"
                      : "live"
                })
              }
            );

          const data =
            await response.json();

          if (!response.ok) {
            throw new Error(
              data.error ||
              data.message ||
              "Checkout failed."
            );
          }

          if (!data.url) {
            throw new Error(
              "Stripe checkout URL was not returned."
            );
          }

          window.location.assign(
            data.url
          );

        } catch (error) {
          console.error(
            "Checkout error:",
            error
          );

          status.textContent =
            "❌ " + error.message;

          button.disabled = false;
        }
      }
    );
  });


const checkoutStatus =
  new URLSearchParams(
    window.location.search
  ).get("checkout");


if (checkoutStatus === "success") {
  $("pricingStatus").textContent =
    "✅ Payment completed. Updating your account...";

  setTimeout(
    async function () {
      await checkSession();

      $("pricingStatus").textContent =
        "✅ Subscription activated.";
    },
    2000
  );
}


if (checkoutStatus === "cancelled") {
  $("pricingStatus").textContent =
    "Payment cancelled.";
}


checkSession();

</script>

</body>
</html>
