<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset Password | LocalBoost AI</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#1f2937}header{background:#111827;color:#fff;padding:38px 20px;text-align:center}.card{width:92%;max-width:520px;margin:35px auto;background:#fff;padding:24px;border-radius:14px;box-shadow:0 4px 18px rgba(0,0,0,.08)}input,button{width:100%;font-size:16px}input{padding:12px;margin:6px 0 12px;border:1px solid #d1d5db;border-radius:8px}button{padding:13px;border:0;border-radius:8px;background:#2563eb;color:#fff;font-weight:bold;cursor:pointer}.status{margin-top:14px;text-align:center;font-weight:bold}a{color:#2563eb}
</style>
</head>
<body>
<header><h1>LocalBoost AI</h1><p>Create a new password</p></header>
<main class="card">
  <h2>Reset your password</h2>
  <label for="password">New password</label>
  <input id="password" type="password" autocomplete="new-password" minlength="8" maxlength="200" required>
  <label for="confirmPassword">Confirm new password</label>
  <input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" maxlength="200" required>
  <button id="resetButton" type="button">Update Password</button>
  <div id="status" class="status"></div>
</main>
<script>
"use strict";
const token = new URLSearchParams(location.hash.slice(1)).get("token") || "";
history.replaceState(null, "", location.pathname);
const button = document.getElementById("resetButton");
const status = document.getElementById("status");

if (!/^[a-f0-9]{64}$/i.test(token)) {
  button.disabled = true;
  status.textContent = "❌ This reset link is invalid or expired.";
}

button.addEventListener("click", async function () {
  const password = document.getElementById("password").value;
  const confirmation = document.getElementById("confirmPassword").value;

  if (password.length < 8 || password.length > 200) {
    status.textContent = "❌ Password must be between 8 and 200 characters.";
    return;
  }
  if (password !== confirmation) {
    status.textContent = "❌ Passwords do not match.";
    return;
  }

  button.disabled = true;
  button.textContent = "Updating...";
  status.textContent = "";

  try {
    const response = await fetch("/reset-password", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token, password })
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.error || "Password reset failed.");
    status.innerHTML = '✅ Password updated. <a href="/">Log in now</a>.';
    document.getElementById("password").value = "";
    document.getElementById("confirmPassword").value = "";
  } catch (error) {
    status.textContent = "❌ " + error.message;
    button.disabled = false;
    button.textContent = "Update Password";
  }
});
</script>
</body>
</html>
