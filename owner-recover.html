<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Account Recovery | LocalBoost AI</title>
</head>
<body>
<main>
  <h1>LocalBoost AI account recovery</h1>
  <p>This one-use page is available only for an authorised owner recovery.</p>
  <label for="recoveryToken">Recovery token</label>
  <input id="recoveryToken" type="password" autocomplete="off">
  <label for="newEmail">New account email</label>
  <input id="newEmail" type="email" autocomplete="email">
  <button id="recoverButton" type="button">Update Account Email</button>
  <p id="status" role="status"></p>
</main>
<script>
"use strict";
document.getElementById("recoverButton").addEventListener("click", async function () {
  const button = this;
  const status = document.getElementById("status");
  const token = document.getElementById("recoveryToken").value;
  const email = document.getElementById("newEmail").value.trim();
  button.disabled = true;
  status.textContent = "Updating...";
  try {
    const response = await fetch("/owner-recover-email", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-Recovery-Token": token
      },
      body: JSON.stringify({ email })
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.error || "Recovery failed.");
    document.getElementById("recoveryToken").value = "";
    status.textContent = "Account email updated successfully.";
  } catch (error) {
    status.textContent = error.message;
    button.disabled = false;
  }
});
</script>
</body>
</html>
